  <h1>module / import / __main__ 速查</h1>
  <table>
    <thead><tr><th>场景</th><th><code>__name__</code></th><th>入口保护是否执行</th></tr></thead>
    <tbody>
      <tr><td><code>python query_tools.py</code></td><td><code>"__main__"</code></td><td>是</td></tr>
      <tr><td><code>import query_tools</code></td><td><code>"query_tools"</code></td><td>否</td></tr>
    </tbody>
  </table>
  <pre><code>def main():
    # 演示或启动逻辑
    ...

if __name__ == "__main__":
    main()</code></pre>
  <p><strong>放在模块顶层：</strong>函数、类、模块常量和必要的导入。</p>
  <p><strong>放在入口保护内：</strong>演示输出、手工测试和应用启动调用。</p>
